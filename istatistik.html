<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstatistikler | Öğrenci Not Kayıt Sistemi</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistem İstatistikleri</h1>
            <p>Kademe ve Şube Bazlı Detaylı Başarı Analizleri</p>
            <div style="margin-top: 15px;">
                <a href="index.html" class="btn-nav">Ana Sayfaya Dön</a>
            </div>
        </header>

        <main class="stats-main">
            <div class="minimal-filter-container">
                <div class="minimal-filter-group">
                    <select id="statsFilter" class="minimal-select">
                        <option value="5-all">5. Sınıflar (Tüm Kademe)</option>
                        <option value="6-all">6. Sınıflar (Tüm Kademe)</option>
                        <optgroup label="5. Sınıf Şubeleri">
                            <option value="5-A">5/A Sınıfı Analizi</option>
                            <option value="5-B">5/B Sınıfı Analizi</option>
                            <option value="5-C">5/C Sınıfı Analizi</option>
                            <option value="5-D">5/D Sınıfı Analizi</option>
                            <option value="5-E">5/E Sınıfı Analizi</option>
                        </optgroup>
                        <optgroup label="6. Sınıf Şubeleri">
                            <option value="6-A">6/A Sınıfı Analizi</option>
                            <option value="6-B">6/B Sınıfı Analizi</option>
                            <option value="6-C">6/C Sınıfı Analizi</option>
                            <option value="6-D">6/D Sınıfı Analizi</option>
                            <option value="6-E">6/E Sınıfı Analizi</option>
                        </optgroup>
                    </select>
                    
                    <button id="btnExportStatsPDF" class="btn-minimal-pdf">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Rapor
                    </button>
                </div>
            </div>

            <div id="dynamicStatsContainer" class="summary-cards">
                </div>

            <div id="chartsWrapper" class="charts-grid">
                <div class="chart-container">
                    <h3 id="barChartTitle">Karşılaştırma Grafiği</h3>
                    <canvas id="barChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3 id="pieChartTitle">Baraj Durumu</h3>
                    <canvas id="pieChart"></canvas>
                </div>
            </div>

        </main>
    </div>

    <script type="module" src="istatistik.js"></script>
</body>
</html>
